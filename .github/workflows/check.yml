name: Native mobile checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepare:assets
      - run: pnpm run check
      - run: pnpm run harmony:genui-runtime
      - run: pnpm run harmony:genui-runtime:check
      - run: pnpm run test:harmony
      - run: pnpm run test:miniapps
      - run: pnpm run test:brand
      - run: node --test tests/mobile-package.test.mjs
      - run: pnpm run test:browser
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepare:assets
      - run: ./gradlew jvmTest --no-daemon
        working-directory: src/apps/mobile/shared
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
        working-directory: src/apps/mobile/android
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: android-test-reports
          path: |
            src/apps/mobile/shared/*/build/test-results/
            src/apps/mobile/android/app/build/test-results/
          if-no-files-found: ignore
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileKotlinIosSimulatorArm64 --no-daemon
        working-directory: src/apps/mobile/shared
      - run: ./Testing/run-pure-swift-tests.sh
        working-directory: src/apps/mobile/ios
